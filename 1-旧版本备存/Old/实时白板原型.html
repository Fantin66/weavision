<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board · 实时协作白板原型</title>
<style>
  :root {
    --topbar: #23272e;
    --topbar-hi: #eef1f5;
    --topbar-mid: #9aa3b2;
    --topbar-border: #333942;
    --accent: #d97757;
    --accent-hover: #e0845f;
    --board-bg: #ffffff;
    --grid: #e9edf1;
    --grid-strong: #dde2e8;
    --card-bg: #ffffff;
    --card-border: #e2e8f0;
    --ink: #1f2937;
    --ink-dim: #6b7280;
    --sel: #d97757;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: var(--board-bg);
  }

  /* ---------- 顶栏 ---------- */
  #topbar {
    position: fixed; inset: 0 0 auto 0; height: 48px; z-index: 50;
    display: flex; align-items: center; gap: 6px;
    padding: 0 10px;
    background: var(--topbar);
    border-bottom: 1px solid var(--topbar-border);
    color: var(--topbar-hi);
    user-select: none; -webkit-user-select: none;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 0 8px; cursor: default; }
  .brand .logo { color: var(--accent); display: flex; }
  .brand .name { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
  .brand .badge {
    font-size: 10px; font-weight: 500; color: #b9c1ce;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 999px; padding: 2px 8px; margin-left: 2px;
  }
  .sep { width: 1px; height: 22px; background: var(--topbar-border); margin: 0 6px; flex: none; }
  .spacer { flex: 1; }

  .tool-group { display: flex; align-items: center; gap: 2px; }
  .tbtn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 32px; border: none; border-radius: 7px;
    background: transparent; color: var(--topbar-mid);
    cursor: pointer; transition: background .12s ease, color .12s ease;
  }
  .tbtn:hover { background: rgba(255,255,255,.09); color: var(--topbar-hi); }
  .tbtn.active { background: var(--accent); color: #fff; }
  .tbtn:active { transform: scale(.95); }
  .tbtn.wide { width: auto; padding: 0 10px; gap: 6px; font-size: 12.5px; font-weight: 500; }
  .tbtn .kbd {
    font-size: 10px; opacity: .75; border: 1px solid currentColor; opacity:.55;
    border-radius: 4px; padding: 0 4px; line-height: 14px; margin-left: 2px;
  }

  #toolOptions { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  #toolOptions .opt-group { display: flex; align-items: center; gap: 5px; }
  #toolOptions .opt-label { font-size: 11.5px; color: var(--topbar-mid); margin-right: 2px; }
  .swatches { display: flex; align-items: center; gap: 5px; }
  .swatch {
    width: 16px; height: 16px; border-radius: 5px;
    border: 1px solid rgba(255,255,255,.25);
    cursor: pointer; position: relative; transition: transform .1s ease;
  }
  .swatch:hover { transform: scale(1.18); }
  .swatch.on::after {
    content: ""; position: absolute; inset: -3px;
    border: 2px solid #fff; border-radius: 7px;
  }
  #widthRange { width: 90px; accent-color: var(--accent); height: 4px; }
  #widthVal { font-size: 11.5px; color: var(--topbar-mid); min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; }

  #zoomGroup { margin-right: 4px; }
  #zoomPct {
    font-size: 12px; color: var(--topbar-hi);
    min-width: 44px; text-align: center; font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  #shareBtn {
    display: flex; align-items: center; gap: 7px;
    height: 32px; padding: 0 14px;
    border: none; border-radius: 7px;
    background: var(--accent); color: #fff;
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: background .12s ease, transform .12s ease;
  }
  #shareBtn:hover { background: var(--accent-hover); }
  #shareBtn:active { transform: scale(.96); }

  /* ---------- 画布 ---------- */
  #board { position: fixed; inset: 48px 0 0 0; overflow: hidden; background: var(--board-bg); }
  #canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    touch-action: none;
    cursor: default;
  }
  #board.mode-select #canvas { cursor: default; }
  #board.mode-hand #canvas, #board.space-pan #canvas { cursor: grab; }
  #board.mode-hand.panning #canvas, #board.space-pan.panning #canvas { cursor: grabbing; }
  #board.mode-pen #canvas { cursor: crosshair; }
  #board.mode-connector #canvas { cursor: crosshair; }
  #board.mode-note #canvas { cursor: copy; }

  /* 便签编辑器 */
  #noteEditor {
    position: absolute; z-index: 20;
    display: none;
    border: none; outline: 2px solid var(--accent); outline-offset: -1px;
    border-radius: 4px;
    padding: 10px 10px 8px;
    font-size: 13px; line-height: 18px;
    font-family: inherit; color: var(--ink);
    resize: none; overflow: auto;
    box-shadow: 0 8px 24px rgba(15,23,42,.18);
  }

  /* 选中浮动工具条 */
  #selbar {
    position: absolute; z-index: 30;
    display: none;
    align-items: center; gap: 4px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 5px 7px;
    box-shadow: 0 6px 20px rgba(15,23,42,.14);
  }
  #selbar .sbtn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border: none; border-radius: 6px;
    background: transparent; color: var(--ink-dim); cursor: pointer;
    transition: background .1s ease, color .1s ease;
  }
  #selbar .sbtn:hover { background: #f1f5f9; color: var(--ink); }
  #selbar .swatch { width: 14px; height: 14px; border-radius: 4px; border-color: rgba(0,0,0,.12); flex: none; }
  #selbar .ssep { width: 1px; height: 16px; background: var(--card-border); margin: 0 2px; }
  #selbar .stype { font-size: 10.5px; color: var(--ink-dim); margin: 0 4px; white-space: nowrap; }

  /* 右键菜单 */
  #ctxMenu {
    position: absolute; z-index: 60;
    display: none;
    min-width: 148px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 10px 32px rgba(15,23,42,.18);
    font-size: 12.5px; color: var(--ink);
  }
  #ctxMenu .citem {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: 7px; cursor: pointer;
    font-weight: 500;
  }
  #ctxMenu .citem:hover { background: #f1f5f9; }
  #ctxMenu .citem svg { flex: none; color: var(--ink-dim); }
  #ctxMenu .csep { height: 1px; background: var(--card-border); margin: 4px 6px; }
  #ctxMenu .cswatch-row { display: flex; gap: 6px; padding: 6px 10px 4px; flex-wrap: wrap; }
  #ctxMenu .swatch { width: 18px; height: 18px; border-color: rgba(0,0,0,.12); border-radius: 5px; }

  /* 快捷帮助浮层 */
  #helpPop {
    position: absolute; z-index: 70;
    display: none;
    width: 264px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 0 6px;
    box-shadow: 0 12px 36px rgba(15,23,42,.2);
  }
  #helpPop h4 { font-size: 12px; color: var(--ink-dim); font-weight: 600; padding: 0 14px 6px; letter-spacing: .4px; }
  #helpPop .hrow { display: flex; justify-content: space-between; align-items: center; padding: 4px 14px; font-size: 12.5px; color: var(--ink); }
  #helpPop .k { font-size: 11px; color: var(--ink-dim); background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 5px; padding: 1px 6px; font-variant-numeric: tabular-nums; }

  /* 左下状态栏 */
  #statusbar {
    position: absolute; left: 14px; bottom: 14px; z-index: 20;
    display: flex; gap: 14px;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(6px);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 11.5px; color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    pointer-events: none; user-select: none;
  }
  #statusbar b { color: var(--ink); font-weight: 600; }

  /* 迷你地图 */
  #minimapWrap {
    position: absolute; right: 16px; bottom: 16px; z-index: 20;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(15,23,42,.12);
    padding: 3px;
    cursor: crosshair;
  }
  #minimap { display: block; border-radius: 7px; }
  .mm-label {
    position: absolute; top: 6px; left: 8px;
    font-size: 10px; color: var(--ink-dim); letter-spacing: .3px;
    pointer-events: none; user-select: none;
  }

  /* 工具提示 */
  .tt { display: hidden; }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/>
        <rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>
      </svg>
    </span>
    <span class="name">Board</span>
    <span class="badge">协作白板 · 原型</span>
  </div>

  <div class="sep"></div>

  <div class="tool-group" id="toolGroup"></div>

  <div class="sep"></div>

  <div class="tool-group" id="historyGroup">
    <button class="tbtn" id="undoBtn" title="撤销 (Ctrl+Z)"></button>
    <button class="tbtn" id="redoBtn" title="重做 (Ctrl+Shift+Z)"></button>
  </div>

  <div id="toolOptions"></div>

  <div class="spacer"></div>

  <div class="tool-group" id="zoomGroup">
    <button class="tbtn" id="zoomOutBtn" title="缩小"></button>
    <span id="zoomPct">100%</span>
    <button class="tbtn" id="zoomInBtn" title="放大"></button>
    <button class="tbtn" id="fitBtn" title="适应全部内容"></button>
    <button class="tbtn" id="helpBtn" title="快捷键"></button>
  </div>

  <button id="shareBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
      <path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/>
    </svg>
    邀请协作
  </button>
</header>

<main id="board" class="mode-select">
  <canvas id="canvas"></canvas>
  <textarea id="noteEditor" spellcheck="false" placeholder="输入内容…"></textarea>
  <div id="selbar"></div>
  <div id="statusbar"></div>
  <div id="minimapWrap">
    <span class="mm-label">全景</span>
    <canvas id="minimap" width="300" height="196"></canvas>
  </div>
  <div id="ctxMenu"></div>
  <div id="helpPop">
    <h4>快捷键</h4>
    <div class="hrow"><span>选择 / 抓手 / 便签 / 画笔 / 连线</span><span class="k">V · H · N · P · L</span></div>
    <div class="hrow"><span>画布平移</span><span class="k">空格 + 拖拽</span></div>
    <div class="hrow"><span>滚轮</span><span class="k">缩放画布</span></div>
    <div class="hrow"><span>双击便签</span><span class="k">编辑文字</span></div>
    <div class="hrow"><span>右键元素</span><span class="k">菜单/删除</span></div>
    <div class="hrow"><span>删除选中</span><span class="k">Delete</span></div>
    <div class="hrow"><span>复制选中</span><span class="k">Ctrl + D</span></div>
    <div class="hrow"><span>撤销 / 重做</span><span class="k">Ctrl+Z / Y</span></div>
    <div class="hrow"><span>取消 / 关闭</span><span class="k">Esc</span></div>
  </div>
</main>

<script>
(() => {
"use strict";

/* ============================================================
   常量与工具图标
============================================================ */
const FONT = '"Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
const NOTE_COLORS = ["#fde68a", "#fed7aa", "#fbcfe8", "#e9d5ff", "#bfdbfe", "#bbf7d0", "#e5e7eb"];
const LINE_COLORS = ["#d97757", "#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#475569"];
const DEFAULT_NOTE_COLOR = "#fde68a";
const DEFAULT_LINE_COLOR = "#475569";

const ICON = {
  select: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg>',
  hand: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>',
  note: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/></svg>',
  pen: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>',
  connector: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11V5h6"/><path d="M19 13v6h-6"/><path d="m5 5 14 14"/></svg>',
  undo: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 0 0 1-5.5 5.5H11"/></svg>',
  redo: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5 0 0 0 9.5 20H13"/></svg>',
  zoomIn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>',
  zoomOut: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6"/></svg>',
  fit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>',
  help: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>',
  copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
};

const TOOLS = [
  { id: "select",   label: "选择", key: "V", icon: "select" },
  { id: "hand",     label: "抓手", key: "H", icon: "hand" },
  { id: "note",     label: "便签", key: "N", icon: "note" },
  { id: "pen",      label: "画笔", key: "P", icon: "pen" },
  { id: "connector",label: "连线", key: "L", icon: "connector" },
];

/* ============================================================
   DOM 引用
============================================================ */
const board    = document.getElementById("board");
const canvas   = document.getElementById("canvas");
const ctx      = canvas.getContext("2d");
const selbar   = document.getElementById("selbar");
const noteEd   = document.getElementById("noteEditor");
const ctxMenu  = document.getElementById("ctxMenu");
const helpPop  = document.getElementById("helpPop");
const statBar  = document.getElementById("statusbar");
const mmWrap   = document.getElementById("minimapWrap");
const mm       = document.getElementById("minimap");
const mmCtx    = mm.getContext("2d");
const toolOptions = document.getElementById("toolOptions");
const zoomPctEl   = document.getElementById("zoomPct");

let W = 0, H = 0, dpr = 1;

/* ============================================================
   状态
============================================================ */
const state = {
  tool: "select",
  camera: { x: 0, y: 0, zoom: 1 },
  items: [],            // {id,type,...}
  selected: null,       // item id
  spaceDown: false,
  mouseWorld: { x: 0, y: 0 },
  penSize: 3,
  penColor: LINE_COLORS[0],
  lineColor: LINE_COLORS[6],
  noteColor: DEFAULT_NOTE_COLOR,
};

let uid = 1;
let drag = null;              // 当前交互
let renderQueued = false;
let editingNoteId = null;

const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 60;

/* 工具函数 */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cloneItems = () => JSON.parse(JSON.stringify(state.items));
function pushHistory() {
  undoStack.push(cloneItems());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
  syncHistoryBtns();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(cloneItems());
  state.items = undoStack.pop();
  state.selected = null;
  closeEditor(true);
  syncHistoryBtns(); render();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(cloneItems());
  state.items = redoStack.pop();
  state.selected = null;
  closeEditor(true);
  syncHistoryBtns(); render();
}
function syncHistoryBtns() {
  document.getElementById("undoBtn").style.opacity = undoStack.length ? 1 : .4;
  document.getElementById("redoBtn").style.opacity = redoStack.length ? 1 : .4;
}

/* ============================================================
   坐标变换
============================================================ */
const s2w = (sx, sy) => ({ x: state.camera.x + sx / state.camera.zoom, y: state.camera.y + sy / state.camera.zoom });
const w2s = (wx, wy) => ({ x: (wx - state.camera.x) * state.camera.zoom, y: (wy - state.camera.y) * state.camera.zoom });

/* ============================================================
   画布尺寸
============================================================ */
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = board.clientWidth; H = board.clientHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  render();
}

/* ============================================================
   缩放 / 平移
============================================================ */
function zoomAt(sx, sy, factor) {
  const nz = clamp(state.camera.zoom * factor, 0.15, 4);
  const wx = state.camera.x + sx / state.camera.zoom;
  const wy = state.camera.y + sy / state.camera.zoom;
  state.camera.zoom = nz;
  state.camera.x = wx - sx / nz;
  state.camera.y = wy - sy / nz;
  if (zoomPctEl) zoomPctEl.textContent = Math.round(nz * 100) + "%";
  render();
}
function fitAll() {
  const b = boundsOfItems();
  if (!b) return;
  const pad = 90;
  const z = clamp(Math.min((W - pad * 2) / b.w, (H - pad * 2) / b.h), 0.15, 1.6);
  state.camera.zoom = z;
  state.camera.x = b.x - (W / z - b.w) / 2;
  state.camera.y = b.y - (H / z - b.h) / 2;
  zoomPctEl.textContent = Math.round(z * 100) + "%";
  render();
}
function boundsOfItems() {
  let b = null;
  for (const it of state.items) {
    const ib = itemBounds(it);
    if (!ib) continue;
    b = b ? union(b, ib) : ib;
  }
  if (!b) b = { x: -320, y: -240, w: 640, h: 480 };
  return b;
}
function union(a, b) {
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  const x2 = Math.max(a.x + a.w, b.x + b.w), y2 = Math.max(a.y + a.h, b.y + b.h);
  return { x, y, w: x2 - x, h: y2 - y };
}
function itemBounds(it) {
  if (it.type === "note") return { x: it.x, y: it.y, w: it.w, h: it.h };
  if (it.type === "stroke") {
    if (!it.points.length) return null;
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const p of it.points) {
      if (p.x < x1) x1 = p.x; if (p.x > x2) x2 = p.x;
      if (p.y < y1) y1 = p.y; if (p.y > y2) y2 = p.y;
    }
    return { x: x1 - it.size, y: y1 - it.size, w: x2 - x1 + it.size * 2, h: y2 - y1 + it.size * 2 };
  }
  if (it.type === "connector") {
    const a = resolveEnd(it.a), b2 = resolveEnd(it.b);
    return {
      x: Math.min(a.x, b2.x) - 12, y: Math.min(a.y, b2.y) - 12,
      w: Math.abs(b2.x - a.x) + 24, h: Math.abs(b2.y - a.y) + 24,
    };
  }
  return null;
}

/* ============================================================
   渲染
============================================================ */
function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function render() {
  const z = state.camera.zoom;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);

  drawGrid(z);

  ctx.save();
  ctx.translate(-state.camera.x * z, -state.camera.y * z);
  ctx.scale(z, z);

  const sel = selectedItem();
  for (const it of state.items) {
    if (it !== sel) drawItem(it);
  }
  if (sel) { drawItem(sel); drawSelection(sel); }

  /* 进行中的交互预览 */
  if (drag) {
    if (drag.mode === "pen" && drag.points.length > 1) {
      ctx.strokeStyle = state.penColor;
      ctx.lineWidth = state.penSize;
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      drag.points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.stroke();
    }
    if (drag.mode === "connector") {
      const a = resolveEnd(drag.a);
      const b = resolveEnd(drag.b);
      drawConnectorLine(ctx, a, b, state.lineColor, Math.max(1.5, state.penSize), true);
    }
  }
  ctx.restore();

  updateSelBar();
  updateStatusBar();
  paintMinimap();
}

function drawGrid(z) {
  let step = 20;
  while (step * z < 16) step *= 2;
  const i0x = Math.floor(state.camera.x / step);
  const i0y = Math.floor(state.camera.y / step);
  const i1x = Math.ceil((state.camera.x + W / z) / step);
  const i1y = Math.ceil((state.camera.y + H / z) / step);

  ctx.lineWidth = 1;
  ctx.strokeStyle = "#eef1f5";
  ctx.beginPath();
  for (let i = i0x; i <= i1x; i++) {
    if (i % 5 === 0) continue;
    ctx.moveTo(i * step, i0y * step); ctx.lineTo(i * step, i1y * step);
  }
  for (let j = i0y; j <= i1y; j++) {
    if (j % 5 === 0) continue;
    ctx.moveTo(i0x * step, j * step); ctx.lineTo(i1x * step, j * step);
  }
  ctx.stroke();

  ctx.strokeStyle = "#dde2e8";
  ctx.beginPath();
  for (let i = Math.floor(i0x / 5); i <= Math.ceil(i1x / 5); i++) {
    ctx.moveTo(i * step * 5, i0y * step); ctx.lineTo(i * step * 5, i1y * step);
  }
  for (let j = Math.floor(i0y / 5); j <= Math.ceil(i1y / 5); j++) {
    ctx.moveTo(i0x * step, j * step * 5); ctx.lineTo(i1x * step, j * step * 5);
  }
  ctx.stroke();
}

function drawItem(it) {
  if (it.type === "note") drawNote(it);
  else if (it.type === "stroke") drawStroke(it);
  else if (it.type === "connector") drawConnector(it);
}

function roundRectPath(c, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + rr, y);
  c.arcTo(x + w, y, x + w, y + h, rr);
  c.arcTo(x + w, y + h, x, y + h, rr);
  c.arcTo(x, y + h, x, y, rr);
  c.arcTo(x, y, x + w, y, rr);
  c.closePath();
}

function wrapLines(c, text, maxW) {
  const lines = [];
  for (const para of String(text).split("\n")) {
    let line = "";
    for (const ch of para) {
      const t = line + ch;
      if (c.measureText(t).width > maxW && line) { lines.push(line); line = ch; }
      else line = t;
    }
    if (line) lines.push(line);
  }
  return lines.length ? lines : [""];
}

function drawNote(it) {
  const c = ctx;
  const { x, y, w, h } = it;
  c.save();
  c.shadowColor = "rgba(15,23,42,.14)";
  c.shadowBlur = 6 / state.camera.zoom;
  c.shadowOffsetY = 2 / state.camera.zoom;
  roundRectPath(c, x, y, w, h, 4);
  c.fillStyle = it.color;
  c.fill();
  c.restore();
  /* 顶部色带（便签黏胶质感） */
  c.save();
  roundRectPath(c, x, y, w, Math.min(10, h / 4), 4);
  c.clip();
  c.fillStyle = "rgba(255,255,255,.28)";
  c.fillRect(x, y, w, 6);
  c.restore();
  /* 若宽度足够画文字 */
  if (w > 34 && h > 22) {
    c.font = "13px " + FONT;
    c.fillStyle = "rgba(30,41,59,.82)";
    c.textBaseline = "top";
    const lines = wrapLines(c, it.text, w - 20);
    const lh = 18;
    const maxLines = Math.max(1, Math.floor((h - 14) / lh));
    lines.slice(0, maxLines).forEach((ln, i) => c.fillText(ln, x + 10, y + 12 + i * lh));
    if (lines.length > maxLines) c.fillText("…", x + 10, y + 12 + (maxLines - 1) * lh + 12);
  }
}

function drawStroke(it) {
  const c = ctx;
  if (!it.points.length) return;
  c.strokeStyle = it.color;
  c.lineWidth = it.size;
  c.lineCap = "round"; c.lineJoin = "round";
  c.beginPath();
  it.points.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y));
  c.stroke();
}

/* 端点解析：若锚定便签则跟随 */
function resolveEnd(p) {
  if (p.noteId) {
    const n = state.items.find(i => i.id === p.noteId);
    if (n) return { x: n.x + p.ox, y: n.y + p.oy };
    return { x: 0, y: 0, free: true };
  }
  return { x: p.x, y: p.y, free: true };
}
/* 直线段从矩形中心到矩形边缘的交点 */
function edgePoint(cx, cy, px, py, r) {
  let dx = px - cx, dy = py - cy;
  const d2 = dx * dx + dy * dy;
  if (d2 < 1e-6) return { x: cx, y: cy };
  const tx = dx > 0 ? (r.x + r.w - cx) / dx : dx < 0 ? (r.x - cx) / dx : Infinity;
  const ty = dy > 0 ? (r.y + r.h - cy) / dy : dy < 0 ? (r.y - cy) / dy : Infinity;
  const t = Math.min(Math.max(tx, 0), Math.max(ty, 0));
  if (t === Infinity || t <= 0) return { x: cx, y: cy };
  return { x: cx + dx * t, y: cy + dy * t };
}

function drawConnectorLine(c, a, b, color, width, arrowEnd) {
  c.strokeStyle = color;
  c.lineWidth = width;
  c.lineCap = "round";
  c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
  if (arrowEnd) {
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    const L = 8, spread = 0.45;
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(b.x, b.y);
    c.lineTo(b.x - L * Math.cos(ang - spread), b.y - L * Math.sin(ang - spread));
    c.lineTo(b.x - L * Math.cos(ang + spread), b.y - L * Math.sin(ang + spread));
    c.closePath(); c.fill();
  }
}

function drawConnector(it) {
  let a = resolveEnd(it.a);
  let b = resolveEnd(it.b);
  /* 锚定便签时裁到边缘 */
  if (!it.a.free && !a.free) {
    const n = state.items.find(i => i.id === it.a.noteId);
    if (n) a = edgePoint(n.x + n.w / 2, n.y + n.h / 2, b.x, b.y, n);
  }
  if (!it.b.free && !b.free) {
    const n = state.items.find(i => i.id === it.b.noteId);
    if (n) b = edgePoint(n.x + n.w / 2, n.y + n.h / 2, a.x, a.y, n);
  }
  drawConnectorLine(ctx, a, b, it.color, Math.max(1.5, it.width || 2), true);
}

/* ---------- 选中框与手柄 ---------- */
function selectedItem() {
  if (!state.selected) return null;
  return state.items.find(i => i.id === state.selected) || null;
}
const HANDLES = ["nw", "n", "ne", "e", "se", "s", "sw", "w"];
function handlePos(b, h) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  return {
    nw: { x: b.x, y: b.y }, n: { x: cx, y: b.y }, ne: { x: b.x + b.w, y: b.y },
    e: { x: b.x + b.w, y: cy }, se: { x: b.x + b.w, y: b.y + b.h }, s: { x: cx, y: b.y + b.h },
    sw: { x: b.x, y: b.y + b.h }, w: { x: b.x, y: cy },
  }[h];
}
function drawSelection(it) {
  const c = ctx;
  const z = state.camera.zoom;
  const b = itemBounds(it);
  if (!b) return;
  c.save();
  c.setLineDash([6 / z, 4 / z]);
  c.lineWidth = 1.5 / z;
  c.strokeStyle = state.selColor || "#d97757";
  c.strokeRect(b.x, b.y, b.w, b.h);
  c.setLineDash([]);
  if (it.type === "note") {
    const r = 3.5 / z;
    for (const h of HANDLES) {
      const p = handlePos(b, h);
      c.fillStyle = "#ffffff";
      c.strokeStyle = "#d97757";
      c.lineWidth = 1.5 / z;
      c.beginPath(); c.arc(p.x, p.y, r, 0, 7); c.fill(); c.stroke();
    }
  }
  c.restore();
}

function hitTest(wx, wy) {
  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    if (it.type === "note") {
      if (wx >= it.x && wx <= it.x + it.w && wy >= it.y && wy <= it.y + it.h) return it;
    } else if (it.type === "stroke") {
      const tol = Math.max(6, it.size) / state.camera.zoom + 3 / state.camera.zoom;
      if (segDistToPoint(it.points, wx, wy) <= tol) return it;
    } else if (it.type === "connector") {
      const a = resolveEnd(it.a), b = resolveEnd(it.b);
      if (distToSegment(wx, wy, a, b) <= 10 / state.camera.zoom) return it;
    }
  }
  return null;
}
function segDistToPoint(pts, x, y) {
  if (pts.length < 2) return Infinity;
  let best = Infinity;
  for (let i = 1; i < pts.length; i++) {
    const d = distToSegment(x, y, pts[i - 1], pts[i]);
    if (d < best) best = d;
  }
  return best;
}
function distToSegment(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - a.x) * dx + (py - a.y) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  const x = a.x + dx * t, y = a.y + dy * t;
  return Math.hypot(px - x, py - y);
}

/* 命中 8 个缩放手柄（屏幕坐标） */
function hitHandle(sel, sx, sy) {
  const b = itemBounds(sel);
  if (!b) return null;
  for (const h of HANDLES) {
    const p = w2s(handlePos(b, h).x, handlePos(b, h).y);
    if (Math.hypot(sx - p.x, sy - p.y) <= 9) return h;
  }
  return null;
}

/* ============================================================
   便签 / 画笔 / 连线 创建
============================================================ */
function addNote(x, y, text, color) {
  const it = {
    id: uid++,
    type: "note",
    x: Math.round(x - 80), y: Math.round(y - 40),
    w: 160, h: 90,
    text: text === undefined ? "双击编辑" : text,
    color: color || DEFAULT_NOTE_COLOR,
  };
  state.items.push(it);
  return it;
}
function addStroke(wx, wy) {
  const it = { id: uid++, type: "stroke", points: [{ x: wx, y: wy }], color: state.penColor, size: state.penSize };
  state.items.push(it);
  return it;
}
function anchorFor(wx, wy) {
  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    if (it.type === "note" && wx >= it.x && wx <= it.x + it.w && wy >= it.y && wy <= it.y + it.h) {
      return { noteId: it.id, ox: wx - it.x, oy: wy - it.y, free: false };
    }
  }
  return { x: wx, y: wy, free: true };
}
function addConnector(a, b) {
  const it = { id: uid++, type: "connector", a, b, color: state.lineColor, width: Math.max(1.5, state.penSize) };
  state.items.push(it);
  return it;
}
function deleteItem(id) {
  const idx = state.items.findIndex(i => i.id === id);
  if (idx < 0) return;
  pushHistory();
  state.items.splice(idx, 1);
  /* 级联删除引用该便签的连线（否则端点悬空） */
  state.items = state.items.filter(it =>
    it.type !== "connector" || (it.a.noteId !== id && it.b.noteId !== id)
  );
  if (state.selected === id) state.selected = null;
  render();
}
function duplicateItem(id) {
  const src = state.items.find(i => i.id === id);
  if (!src) return;
  pushHistory();
  const cp = JSON.parse(JSON.stringify(src));
  cp.id = uid++;
  if (cp.type === "note") { cp.x += 24; cp.y += 24; }
  if (cp.type === "stroke") cp.points = cp.points.map(p => ({ x: p.x + 24, y: p.y + 24 }));
  if (cp.type === "connector") { cp.a.free && (cp.a.x += 24); cp.a.free && (cp.a.y += 24); cp.b.free && (cp.b.x += 24); cp.b.free && (cp.b.y += 24); }
  state.items.push(cp);
  state.selected = cp.id;
  render();
}

/* ============================================================
   选择浮动工具条
============================================================ */
const SEL_LABEL = { note: "便签", stroke: "画笔", connector: "连线" };
function updateSelBar() {
  if (editingNoteId !== null) { selbar.style.display = "none"; return; }
  const sel = selectedItem();
  if (!sel) { selbar.style.display = "none"; return; }
  if (selbar.dataset.id !== String(sel.id)) renderSelBar(sel);
  const b = itemBounds(sel);
  const sp = w2s(b.x + b.w / 2, b.y);
  selbar.style.display = "flex";
  selbar.style.left = clamp(sp.x - selbar.offsetWidth / 2, 10, W - selbar.offsetWidth - 10) + "px";
  selbar.style.top = Math.max(58, sp.y - selbar.offsetHeight - 14) + "px";
}
function renderSelBar(sel) {
  selbar.dataset.id = String(sel.id);
  selbar.innerHTML = "";
  const type = sel.type;
  const label = document.createElement("span");
  label.className = "stype";
  label.textContent = SEL_LABEL[type] || "";
  selbar.appendChild(label);

  const palette = type === "note" ? NOTE_COLORS : LINE_COLORS;
  const cur = type === "note" ? sel.color : sel.color;
  for (const col of palette) {
    const b = document.createElement("button");
    b.className = "swatch" + (col === cur ? " on" : "");
    b.style.background = col;
    b.title = "颜色";
    b.addEventListener("pointerdown", e => {
      e.stopPropagation();
      e.preventDefault();
      pushHistory();
      sel.color = col;
      if (type === "note") state.noteColor = col;
      renderSelBar(sel);
      render();
    });
    selbar.appendChild(b);
  }

  const sep = document.createElement("span"); sep.className = "ssep"; selbar.appendChild(sep);

  const cp = document.createElement("button");
  cp.className = "sbtn"; cp.title = "复制 (Ctrl+D)"; cp.innerHTML = ICON.copy;
  cp.addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); duplicateItem(sel.id); });
  selbar.appendChild(cp);

  const del = document.createElement("button");
  del.className = "sbtn"; del.title = "删除 (Delete)"; del.innerHTML = ICON.trash; del.style.color = "#dc2626";
  del.addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); deleteItem(sel.id); });
  selbar.appendChild(del);
}

/* ============================================================
   便签编辑器（DOM textarea 覆盖层）
============================================================ */
function openEditor(it) {
  if (editingNoteId === it.id) return;
  editingNoteId = it.id;
  const z = state.camera.zoom;
  const tl = w2s(it.x, it.y);
  const br = w2s(it.x + it.w, it.y + it.h);
  noteEd.style.display = "block";
  noteEd.style.left = tl.x + "px";
  noteEd.style.top = tl.y + "px";
  noteEd.style.width = (br.x - tl.x) + "px";
  noteEd.style.height = (br.y - tl.y) + "px";
  noteEd.style.fontSize = (13 * z) + "px";
  noteEd.style.lineHeight = (18 * z) + "px";
  noteEd.style.background = it.color;
  noteEd.value = it.text;
  noteEd.focus();
  noteEd.setSelectionRange(noteEd.value.length, noteEd.value.length);
}
function closeEditor(cancel) {
  if (editingNoteId === null) return;
  const it = state.items.find(i => i.id === editingNoteId);
  if (it) {
    const v = noteEd.value;
    if (!cancel && v !== it.text) { pushHistory(); it.text = v; }
  }
  editingNoteId = null;
  noteEd.style.display = "none";
  requestRender();
}
function isTyping() {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  return tag === "TEXTAREA" || tag === "INPUT" || document.activeElement === noteEd;
}

/* ============================================================
   右键菜单
============================================================ */
let ctxTarget = null;
function showCtxMenu(e, item) {
  ctxTarget = item;
  ctxMenu.innerHTML = "";
  if (item) {
    const t = item.type;
    const del = mkItem(ICON.trash, "删除", "#dc2626"); del.onclick = () => { hideCtxMenu(); deleteItem(item.id); };
    const dup = mkItem(ICON.copy, "复制", ""); dup.onclick = () => { hideCtxMenu(); duplicateItem(item.id); };
    ctxMenu.appendChild(dup);
    ctxMenu.appendChild(del);
    if (t === "note") {
      const sep = document.createElement("div"); sep.className = "csep"; ctxMenu.appendChild(sep);
      const row = document.createElement("div"); row.className = "cswatch-row";
      NOTE_COLORS.forEach(col => {
        const s = document.createElement("button");
        s.className = "swatch"; s.style.background = col;
        s.onclick = () => { pushHistory(); item.color = col; hideCtxMenu(); render(); };
        row.appendChild(s);
      });
      ctxMenu.appendChild(row);
    }
  } else {
    const add = mkItem(ICON.note, "在此添加便签", "");
    add.onclick = () => {
      hideCtxMenu();
      const wpt = s2w(e.clientX, e.clientY);
      pushHistory(); addNote(wpt.x, wpt.y);
      state.selected = uid - 1; render();
    };
    ctxMenu.appendChild(add);
  }
  ctxMenu.style.display = "block";
  ctxMenu.style.left = clamp(e.clientX, 8, W - ctxMenu.offsetWidth - 8) + "px";
  ctxMenu.style.top = clamp(e.clientY, 56, H - ctxMenu.offsetHeight - 8) + "px";
}
function hideCtxMenu() { ctxMenu.style.display = "none"; ctxTarget = null; }
function mkItem(icon, label, color) {
  const d = document.createElement("div");
  d.className = "citem";
  d.innerHTML = icon + "<span></span>";
  d.lastChild.textContent = label;
  if (color) d.style.color = color;
  return d;
}

/* ============================================================
   指针交互
============================================================ */
canvas.addEventListener("pointerdown", onPointerDown);
canvas.addEventListener("pointermove", onPointerMove);
canvas.addEventListener("pointerup", onPointerUp);
canvas.addEventListener("pointercancel", onPointerUp);
canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  const wpt = s2w(e.clientX, e.clientY);
  const hit = hitTest(wpt.x, wpt.y);
  if (hit) state.selected = hit.id;
  showCtxMenu(e, hit);
  render();
});
canvas.addEventListener("dblclick", e => {
  const wpt = s2w(e.clientX, e.clientY);
  const hit = hitTest(wpt.x, wpt.y);
  if (hit && hit.type === "note") {
    state.selected = hit.id;
    openEditor(hit);
    render();
  }
});
board.addEventListener("wheel", e => {
  if (isTyping()) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0016);
  zoomAt(e.clientX, e.clientY - 48, factor);
}, { passive: false });

function onPointerDown(e) {
  hideCtxMenu();
  if (editingNoteId !== null) closeEditor(false);
  if (e.button === 2) return;
  const sx = e.clientX, sy = e.clientY - 48;
  const wpt = s2w(sx, sy);
  state.mouseWorld = wpt;

  /* 平移：中键 / 空格 / 抓手工具 */
  if (e.button === 1 || state.spaceDown || state.tool === "hand") {
    drag = { mode: "pan", lastX: sx, lastY: sy, pointer: e.pointerId };
    board.classList.add("panning");
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  if (e.button !== 0) return;

  if (state.tool === "select") {
    /* 手柄优先 */
    const sel = selectedItem();
    if (sel && sel.type === "note") {
      const h = hitHandle(sel, sx, sy);
      if (h) {
        pushHistory();
        drag = { mode: "resize", handle: h, item: sel, startW: sel.w, startH: sel.h, startX: sel.x, startY: sel.y, start: wpt, pointer: e.pointerId };
        canvas.setPointerCapture(e.pointerId);
        return;
      }
    }
    const hit = hitTest(wpt.x, wpt.y);
    if (hit) {
      if (state.selected !== hit.id) { state.selected = hit.id; render(); }
      pushHistory();
      drag = {
        mode: "move", item: hit, start: wpt,
        startX: hit.x, startY: hit.y,
        startPts: hit.type === "stroke" ? hit.points.map(p => ({ ...p })) : null,
        startA: hit.type === "connector"
          ? { ax: hit.a.x, ay: hit.a.y, bx: hit.b.x, by: hit.b.y, af: !!hit.a.free, bf: !!hit.b.free }
          : null,
        pointer: e.pointerId,
      };
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    /* 空白 → 平移 */
    state.selected = null;
    drag = { mode: "pan", lastX: sx, lastY: sy, pointer: e.pointerId };
    board.classList.add("panning");
    canvas.setPointerCapture(e.pointerId);
    render();
    return;
  }

  if (state.tool === "note") {
    pushHistory();
    const n = addNote(wpt.x, wpt.y, undefined, state.noteColor);
    state.selected = n.id;
    state.noteColor = n.color;
    drag = { mode: "move", item: n, start: wpt, startX: n.x, startY: n.y, pointer: e.pointerId };
    canvas.setPointerCapture(e.pointerId);
    render();
    return;
  }

  if (state.tool === "pen") {
    pushHistory();
    const s = addStroke(wpt.x, wpt.y);
    drag = { mode: "pen", item: s, points: s.points, last: wpt, pointer: e.pointerId };
    canvas.setPointerCapture(e.pointerId);
    return;
  }

  if (state.tool === "connector") {
    pushHistory();
    const a = anchorFor(wpt.x, wpt.y);
    const b = a.free ? { x: wpt.x + 1, y: wpt.y + 1, free: true } : { ...a };
    drag = { mode: "connector", a, b, pointer: e.pointerId };
    canvas.setPointerCapture(e.pointerId);
    render();
  }
}

function onPointerMove(e) {
  const sx = e.clientX, sy = e.clientY - 48;
  const wpt = s2w(sx, sy);
  state.mouseWorld = wpt;
  if (!drag) return;

  if (drag.mode === "pan") {
    state.camera.x -= (sx - drag.lastX) / state.camera.zoom;
    state.camera.y -= (sy - drag.lastY) / state.camera.zoom;
    drag.lastX = sx; drag.lastY = sy;
    render();
    return;
  }

  if (drag.mode === "move") {
    const dx = wpt.x - drag.start.x, dy = wpt.y - drag.start.y;
    const it = drag.item;
    if (it.type === "stroke" && drag.startPts) {
      it.points.forEach((p, i) => {
        if (drag.startPts[i]) { p.x = drag.startPts[i].x + dx; p.y = drag.startPts[i].y + dy; }
      });
    } else if (it.type === "connector" && drag.startA) {
      if (drag.startA.af) { it.a.x = drag.startA.ax + dx; it.a.y = drag.startA.ay + dy; }
      if (drag.startA.bf) { it.b.x = drag.startA.bx + dx; it.b.y = drag.startA.by + dy; }
    } else {
      it.x = drag.startX + dx;
      it.y = drag.startY + dy;
    }
    render();
    return;
  }

  if (drag.mode === "resize") {
    const dx = wpt.x - drag.start.x, dy = wpt.y - drag.start.y;
    const h = drag.handle, it = drag.item;
    /* nw / n / ne 影响 left/top，w/sw 影响 left，e/ne/se 影响 width 等 */
    if (h.includes("w")) {
      const nw = clamp(drag.startW - dx, 60, 800);
      it.x = drag.startX + (drag.startW - nw);
      it.w = nw;
    } else if (h.includes("e")) {
      it.w = clamp(drag.startW + dx, 60, 800);
    }
    if (h.includes("n")) {
      const nh = clamp(drag.startH - dy, 44, 600);
      it.y = drag.startY + (drag.startH - nh);
      it.h = nh;
    } else if (h.includes("s")) {
      it.h = clamp(drag.startH + dy, 44, 600);
    }
    render();
    return;
  }

  if (drag.mode === "pen") {
    /* 平滑：丢弃过近的点 */
    const last = drag.points[drag.points.length - 1];
    if (Math.hypot(wpt.x - last.x, wpt.y - last.y) > 0.6 / state.camera.zoom) {
      drag.points.push(wpt);
      render();
    }
    return;
  }

  if (drag.mode === "connector") {
    const end = anchorFor(wpt.x, wpt.y);
    drag.b = end;
    render();
    return;
  }
}

function onPointerUp(e) {
  if (!drag) return;
  const d = drag;
  drag = null;
  board.classList.remove("panning");
  if (d.mode === "pen") render();
  else if (d.mode === "connector") {
    /* 距离过短则不创建 */
    const a = resolveEnd(d.a), b = resolveEnd(d.b);
    if (Math.hypot(b.x - a.x, b.y - a.y) > 4 / state.camera.zoom) {
      addConnector(d.a, d.b);
      render();
    }
  } else if (d.mode === "move") {
    /* 便签移动到端点距小于…无要求，直接完成 */
  }
  syncHistoryBtns();
}

/* ============================================================
   键盘
============================================================ */
document.addEventListener("keydown", e => {
  if (isTyping()) {
    if (e.key === "Escape") closeEditor(true);
    if (e.key === "Enter" && !e.shiftKey && document.activeElement === noteEd) closeEditor(false);
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key === "z" || e.key === "Z")) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && (e.key === "y" || e.key === "Y")) { e.preventDefault(); redo(); return; }
  if (mod && (e.key.toLowerCase() === "d")) { e.preventDefault(); const s = selectedItem(); if (s) duplicateItem(s.id); return; }
  if (e.key === "Delete" || e.key === "Backspace") {
    const s = selectedItem();
    if (s) { deleteItem(s.id); }
    return;
  }
  if (e.key === "Escape") {
    state.selected = null;
    hideCtxMenu(); helpPop.style.display = "none";
    render();
    return;
  }
  if (e.key === " ") {
    state.spaceDown = true;
    board.classList.add("space-pan");
    e.preventDefault();
    return;
  }
  const k = e.key.toLowerCase();
  const t = TOOLS.find(t => t.key === k.toUpperCase() && !e.ctrlKey && !e.altKey && !e.metaKey);
  if (t && !e.ctrlKey && !e.metaKey && !e.altKey) setTool(t.id);
});
document.addEventListener("keyup", e => {
  if (e.key === " ") {
    state.spaceDown = false;
    board.classList.remove("space-pan");
  }
});

/* ============================================================
   工具栏
============================================================ */
function setTool(id) {
  if (editingNoteId !== null) closeEditor(false);
  state.tool = id;
  board.className = "mode-" + id + (state.spaceDown ? " space-pan" : "");
  document.querySelectorAll("#toolGroup .tbtn").forEach(b => b.classList.toggle("active", b.dataset.tool === id));
  renderToolOptions();
  requestRender();
}
function buildToolbar() {
  const g = document.getElementById("toolGroup");
  g.innerHTML = "";
  for (const t of TOOLS) {
    const b = document.createElement("button");
    b.className = "tbtn" + (t.id === state.tool ? " active" : "");
    b.dataset.tool = t.id;
    b.innerHTML = ICON[t.icon];
    b.title = t.label + " (" + t.key + ")";
    b.addEventListener("click", () => setTool(t.id));
    g.appendChild(b);
  }
}
function renderToolOptions() {
  toolOptions.innerHTML = "";
  if (state.tool === "pen" || state.tool === "connector") {
    const colors = state.tool === "pen" ? LINE_COLORS : [state.lineColor, ...LINE_COLORS.filter(c => c !== state.lineColor)];
    const cur = state.tool === "pen" ? state.penColor : state.lineColor;
    const g1 = document.createElement("div"); g1.className = "opt-group";
    const lb = document.createElement("span"); lb.className = "opt-label"; lb.textContent = "颜色";
    g1.appendChild(lb);
    const sw = document.createElement("div"); sw.className = "swatches";
    for (const col of LINE_COLORS) {
      const s = document.createElement("button");
      s.className = "swatch" + (col === cur ? " on" : "");
      s.style.background = col;
      s.addEventListener("click", () => {
        if (state.tool === "pen") state.penColor = col; else state.lineColor = col;
        renderToolOptions();
      });
      sw.appendChild(s);
    }
    g1.appendChild(sw);
    toolOptions.appendChild(g1);

    const g2 = document.createElement("div"); g2.className = "opt-group";
    const lb2 = document.createElement("span"); lb2.className = "opt-label"; lb2.textContent = "粗细";
    g2.appendChild(lb2);
    const r = document.createElement("input");
    r.type = "range"; r.id = "widthRange"; r.min = "1"; r.max = state.tool === "pen" ? "24" : "8"; r.step = "1"; r.value = state.penSize;
    r.addEventListener("input", () => {
      state.penSize = +r.value;
      const v = document.getElementById("widthVal");
      if (v) v.textContent = state.penSize;
    });
    const v = document.createElement("span"); v.id = "widthVal"; v.textContent = state.penSize;
    g2.appendChild(r); g2.appendChild(v);
    toolOptions.appendChild(g2);
  } else if (state.tool === "note") {
    const g1 = document.createElement("div"); g1.className = "opt-group";
    const lb = document.createElement("span"); lb.className = "opt-label"; lb.textContent = "便签颜色";
    g1.appendChild(lb);
    const sw = document.createElement("div"); sw.className = "swatches";
    for (const col of NOTE_COLORS) {
      const s = document.createElement("button");
      s.className = "swatch" + (col === state.noteColor ? " on" : "");
      s.style.background = col;
      s.addEventListener("click", () => { state.noteColor = col; renderToolOptions(); });
      sw.appendChild(s);
    }
    g1.appendChild(sw);
    toolOptions.appendChild(g1);
  }
}

/* 撤销/重做按钮 */
document.getElementById("undoBtn").innerHTML = ICON.undo;
document.getElementById("redoBtn").innerHTML = ICON.redo;
document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("redoBtn").addEventListener("click", redo);

/* 缩放按钮 */
document.getElementById("zoomInBtn").innerHTML = ICON.zoomIn;
document.getElementById("zoomOutBtn").innerHTML = ICON.zoomOut;
document.getElementById("fitBtn").innerHTML = ICON.fit;
document.getElementById("helpBtn").innerHTML = ICON.help;
document.getElementById("zoomInBtn").addEventListener("click", () => zoomAt(W / 2, H / 2, 1.25));
document.getElementById("zoomOutBtn").addEventListener("click", () => zoomAt(W / 2, H / 2, 0.8));
document.getElementById("fitBtn").addEventListener("click", fitAll);
document.getElementById("helpBtn").addEventListener("click", e => {
  helpPop.style.display = helpPop.style.display === "block" ? "none" : "block";
  if (helpPop.style.display === "block") {
    const r = e.currentTarget.getBoundingClientRect();
    helpPop.style.right = (W - r.right + 10) + "px";
    helpPop.style.top = (r.bottom + 10) + "px";
  }
});

/* ============================================================
   状态栏
============================================================ */
const statSelCount = document.createElement("span");
const statZoomEl = document.createElement("span");
function updateStatusBar() {
  statBar.innerHTML = "";
  const sel = selectedItem();
  const name = sel ? (SEL_LABEL[sel.type] || sel.type) : "";
  const s1 = document.createElement("span");
  s1.innerHTML = "工具 <b>" + (TOOLS.find(t => t.id === state.tool)?.label || state.tool) + "</b>";
  statBar.appendChild(s1);
  const s2 = document.createElement("span");
  s2.innerHTML = "元素 <b>" + state.items.length + "</b>";
  statBar.appendChild(s2);
  const s3 = document.createElement("span");
  s3.innerHTML = sel ? "选中 <b>" + name + "</b>" : "未选中";
  statBar.appendChild(s3);
  const s4 = document.createElement("span");
  const z = Math.round(state.camera.zoom * 100);
  s4.innerHTML = "缩放 <b>" + z + "%</b>";
  statBar.appendChild(s4);
  const s5 = document.createElement("span");
  const mx = Math.round(state.mouseWorld.x), my = Math.round(state.mouseWorld.y);
  s5.innerHTML = "坐标 <b>(" + mx + ", " + my + ")</b>";
  statBar.appendChild(s5);
}

/* ============================================================
   迷你地图
============================================================ */
const MM_W = 300, MM_H = 196;
function paintMinimap() {
  const b = boundsOfItems();
  const pad = 24;
  const bw = b.w || 1, bh = b.h || 1;
  const scale = Math.min((MM_W - pad * 2) / bw, (MM_H - pad * 2) / bh);
  const cx = MM_W / 2, cy = MM_H / 2;

  mmCtx.clearRect(0, 0, MM_W, MM_H);
  mmCtx.fillStyle = "#ffffff";
  mmCtx.fillRect(0, 0, MM_W, MM_H);

  /* 内容矩形 */
  mmCtx.strokeStyle = "#e2e8f0";
  mmCtx.lineWidth = 1;
  mmCtx.strokeRect(cx - bw * scale / 2, cy - bh * scale / 2, bw * scale, bh * scale);

  /* 元素 */
  for (const it of state.items) {
    const ib = itemBounds(it);
    if (!ib) continue;
    const rx = cx + (ib.x - b.x - ib.w / 2) * scale;
    const ry = cy + (ib.y - b.y - ib.h / 2) * scale;
    const rw = Math.max(1.5, ib.w * scale);
    const rh = Math.max(1.5, ib.h * scale);
    if (it.type === "note") {
      mmCtx.fillStyle = it.color;
      mmCtx.fillRect(rx, ry, rw, rh);
    } else {
      mmCtx.strokeStyle = it.color || "#94a3b8";
      mmCtx.lineWidth = 1;
      mmCtx.strokeRect(rx, ry, rw, rh);
    }
  }

  /* 视口 */
  const vx = state.camera.x, vy = state.camera.y;
  const vw = W / state.camera.zoom, vh = H / state.camera.zoom;
  const px = cx + (vx - b.x - vw / 2) * scale;
  const py = cy + (vy - b.y - vh / 2) * scale;
  const pw = Math.max(4, vw * scale), ph = Math.max(4, vh * scale);
  mmCtx.strokeStyle = "#d97757";
  mmCtx.lineWidth = 1.5;
  mmCtx.strokeRect(px, py, pw, ph);
}

/* 迷你地图交互 */
mm.addEventListener("pointerdown", e => {
  const r = mm.getBoundingClientRect();
  const nx = (e.clientX - r.left) * (MM_W / r.width);
  const ny = (e.clientY - r.top) * (MM_H / r.height);
  const b = boundsOfItems();
  const scale = Math.min((MM_W - 48) / b.w, (MM_H - 48) / b.h);
  const wx = b.x + (nx - MM_W / 2) / scale;
  const wy = b.y + (ny - MM_H / 2) / scale;
  state.camera.x = wx - W / state.camera.zoom / 2;
  state.camera.y = wy - H / state.camera.zoom / 2;
  render();
});

/* ============================================================
   初始化 & 种子数据
============================================================ */
function seedData() {
  const n1 = addNote(160, 140, "欢迎使用 Board 👋\n这是一块无限画布", "#fde68a");
  const n2 = addNote(640, 260, "拖拽便签移动位置\n双击编辑文字", "#bfdbfe");
  const n3 = addNote(980, 150, "右键改颜色\nDelete 删除", "#bbf7d0");
  addConnector(
    { noteId: n1.id, ox: 160, oy: 45, free: false },
    { noteId: n2.id, ox: 0, oy: 45, free: false }
  );
  addConnector(
    { noteId: n2.id, ox: 160, oy: 0, free: false },
    { noteId: n3.id, ox: 0, oy: 45, free: false }
  );
  state.selected = n1.id;
}

/* ============================================================
   启动
============================================================ */
function init() {
  buildToolbar();
  setTool("select");
  syncHistoryBtns();
  resize();
  seedData();
  render();
  window.addEventListener("resize", resize);
}

init();
})();
